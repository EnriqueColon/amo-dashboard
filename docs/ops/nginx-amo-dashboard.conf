# amo-dashboard — nginx front for the Node app on 127.0.0.1:5000.
#
# PROPOSED replacement for /etc/nginx/sites-available/amo-dashboard on the
# droplet (165.22.35.75), drafted 26 Oct 2026. Not yet applied — see
# docs/ops/close-port-5000.md for the ordered runbook, verification and
# rollback. Apply with:
#   cp /etc/nginx/sites-available/amo-dashboard /etc/nginx/amo-dashboard.before_close5000.$(date +%s)
#   install -m 644 docs/ops/nginx-amo-dashboard.conf /etc/nginx/sites-available/amo-dashboard
#   nginx -t && systemctl reload nginx
#
# What changed against the 15 Oct 2026 file (and why):
#
#  1. Content-Encoding: br is stripped before the request reaches Node.
#     Express's body parser inflates request bodies BEFORE the password check,
#     and for `br` it does so with Node's bundled Brotli, which on the EOL
#     Node 20.20.2 the droplet runs is unpatched (CVE-2026-111497). With the
#     header removed, a brotli body is just bytes that fail JSON parsing (400),
#     and zlib's brotli decoder is never entered by a request from outside.
#     The map leaves gzip/deflate/identity alone — nothing we ship sends `br`
#     request bodies (browsers never do), so no real client is affected.
#     `proxy_set_header` with an empty value drops the header entirely.
#
#  2. X-Forwarded-For / X-Forwarded-Proto / X-Real-IP are passed through so
#     Node can see the real client address once it only ever hears from
#     127.0.0.1 (the server does not read them yet — they are for the login
#     rate limit and the access log, both pending; nothing should trust them
#     until `app.set('trust proxy', 'loopback')` is in place).
#
#  3. The websocket upgrade headers are kept, but Connection is now driven by
#     the standard $connection_upgrade map instead of the literal 'upgrade':
#     identical for websocket requests, and plain requests no longer carry a
#     spurious `Connection: upgrade` to the keepalive upstream.
#
# Unchanged (and still the point of this file): the explicit upstream with
# max_fails=0 — with a bare proxy_pass, one refused connection during a
# `pm2 restart` marked the app dead for fail_timeout (10s) and every request
# in that window got a 502 (15 Oct 2026, owner mid-merge). With max_fails=0
# nginx never marks it down, so the 502 window is only the ~2s Node takes to
# boot. A short connect timeout keeps a dead app from hanging requests for 60s.
#
# TLS is NOT in this file: a bare IP cannot get a Let's Encrypt certificate.
# Once the owner picks a hostname, add a `listen 443 ssl` server (certbot
# --nginx does it) and turn the :80 server into a redirect.

# Drop `Content-Encoding: br` on the way to Node; pass anything else as-is.
map $http_content_encoding $strip_ce {
    br      "";
    default $http_content_encoding;
}

# Standard websocket pattern: send `Connection: upgrade` only when the client
# asked to upgrade; otherwise leave Connection empty so upstream keepalive works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream amo_app {
    server 127.0.0.1:5000 max_fails=0;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://amo_app;
        proxy_http_version 1.1;

        # websocket upgrade (kept from the 15 Oct 2026 file)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # never let a brotli-encoded request body reach Node (see header)
        proxy_set_header Content-Encoding $strip_ce;

        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}
